    <style>
      /* Matches the app's paper surface so there is no flash on load. */
      html, body { margin: 0; height: 100%; background: #EBE5E3; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot span {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid rgba(15, 125, 69, .2); border-top-color: #0F7D45;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
</head>
<body>
<div class="boot" aria-hidden="true"><span></span></div>
<script>
  // Remove the boot spinner once Flutter renders its first frame.
  window.addEventListener('flutter-first-frame', function () {
    var el = document.querySelector('.boot');
    if (el) el.remove();
  });
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
